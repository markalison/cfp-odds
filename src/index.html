<!doctype html>
<html lang="en">
<head>
{{HEAD}}
  <title>CFP Odds Board</title>
  <meta name="description" content="Live odds of making the 12-team College Football Playoff, from simulating the rest of the season with ESPN data and computer ratings.">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{{HEADER}}

<main class="container main" id="main">
  <!-- The page heading is hidden on screen; the tabs and section headings carry the layout. -->
  <h1 class="sr-only" id="page-title">College Football Playoff odds</h1>

  <div class="toolbar" id="top-controls" hidden>
    <div class="progress" id="progress" hidden><div class="track"><div class="fill" id="fill"></div></div><span id="progress-text"></span></div>
  </div>

  <div class="stack" id="page-scoreboard" hidden>
    <div class="filters">
      <div class="ctl"><label for="sb-conf">Conference</label><select id="sb-conf"></select></div>
      <div class="ctl"><label for="sb-sort">Sort by</label><select id="sb-sort"><option value="impact">Playoff impact</option><option value="time">Start time</option></select></div>
      <div class="ctl"><label for="mode-sb">Ratings used</label><select id="mode-sb" class="mode-select"></select></div>
    </div>
    <section class="live-board" id="live-board" aria-label="Scores"></section>
  </div>

  <div class="stack" id="page-playoff" hidden>
    <section class="section" aria-labelledby="bracket-title">
      <div class="bk-head">
        <div class="section-head"><h2 id="bracket-title">Projected bracket</h2><p id="bracket-note"></p></div>
        <div class="bk-actions">
          <div class="ctl"><label for="mode-bk">Ratings used</label><select id="mode-bk" class="mode-select"></select></div>
          <button class="btn" id="bk-clear" type="button" hidden>Clear picks</button>
          <button class="btn bk-toggle" id="bk-sim" type="button" aria-pressed="false">Simulate games</button>
        </div>
      </div>
      <div class="bracket" id="bracket"></div>
    </section>
  </div>

  <div class="stack" id="page-rankings">
    <section class="section board" aria-labelledby="board-title">
      <div class="section-head"><h2 id="board-title">All teams</h2><p id="board-count"></p></div>
      <div class="filters">
        <div class="ctl"><label for="conf">Conference</label><select id="conf"></select></div>
        <div class="ctl"><label for="mode">Ratings used</label><select id="mode" class="mode-select"></select></div>
        <div class="picks-bar" id="picks-bar" aria-live="polite"></div>
      </div>
      <div class="table-bar"><button class="table-toggle" id="expand-table" type="button" aria-pressed="false">Show all columns</button></div>
      <div class="table-wrap" id="tw"><table class="odds-table">
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table></div>
    </section>
  </div>
</main>

{{FOOTER}}
<script src="engine.js?v={{V}}"></script>
<script src="data.js?v={{V}}"></script>
<script src="js/app.js?v={{V}}"></script>
</body>
</html>
