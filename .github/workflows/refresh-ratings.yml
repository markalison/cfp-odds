# Rebuilds the odds with the latest ratings and publishes them.
# Every source except Massey is fetched fresh. Massey blocks scripted requests, so massey.tsv
# keeps its last manual update until someone refreshes it from a browser.
name: Refresh ratings

on:
  schedule:
    - cron: '0 11 * * *'   # 6 AM Eastern (7 AM in summer time)
    - cron: '0 21 * * *'   # 4 PM Eastern (5 PM in summer time)
    - cron: '30 5 * * 1,2,5' # after Sunday, Monday and Thursday night NFL games
  workflow_dispatch:        # run by hand from the Actions tab
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-ratings.yml']   # runs once when this file changes

permissions:
  contents: write

concurrency:
  group: refresh-ratings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show how current each source is
        run: node freshness.mjs
        continue-on-error: true

      - name: Rebuild ratings and odds
        run: |
          node build.mjs 40000
          node nfl-build.mjs 50000
          node assemble.mjs

      - name: Publish if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js nfl-data.js index.html about.html nfl.html
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Refresh ratings and odds"
            git pull --rebase origin main
            git push
          fi
